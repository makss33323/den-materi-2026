<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>День матери — скоро</title>
<meta name="description" content="Скоро здесь появится сайт ко Дню матери. 29 ноября 2026.">
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #fff6f6, #ffe9ef 60%, #ffd9e4);
    font-family: Georgia, 'Times New Roman', serif;
    color: #5a3d4a; text-align: center; padding: 24px;
  }
  .card { max-width: 560px; }
  .heart { font-size: 34px; margin-bottom: 18px; }
  h1 { font-size: clamp(44px, 9vw, 84px); font-weight: 600; letter-spacing: .02em; }
  p {
    margin-top: 14px; line-height: 1.5;
    font-family: system-ui, 'Segoe UI', sans-serif;
    font-size: clamp(18px, 3.4vw, 24px); color: #8a6274;
  }
  .date {
    margin-top: 26px; letter-spacing: .14em; text-transform: uppercase;
    font-family: system-ui, 'Segoe UI', sans-serif;
    font-size: 15px; color: #b58a9c;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="heart">&#10084;</div>
    <h1>День матери</h1>
    <p>Скоро здесь появится сайт ко Дню матери</p>
    <div class="date">29 ноября 2026</div>
  </main>
</body>
</html>
